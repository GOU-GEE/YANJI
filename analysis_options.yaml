include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .tooling/**
    - work/**
    - lib/**/*.g.dart
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    avoid_print: true
    unawaited_futures: true
