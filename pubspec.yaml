name: yanji
description: 研迹：本地优先、离线优先的考研学习记录工具。
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.4
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_riverpod: ^2.6.1
  go_router: 17.5.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  timezone: ^0.11.1
  flutter_secure_storage: ^10.3.1
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_mobile_scanner.git
      ref: f5a4ff52f003e1645db1d4de743a2db0313665a8
  http: ^1.2.2
  liquid_glass_renderer:
    path: packages/liquid_glass_renderer
  bonsoir: 7.1.4
  yanji_syncthing:
    path: packages/yanji_syncthing

dependency_overrides:
  # Upstream 3.5.2 bindings, with a narrowly scoped HarmonyOS build hook.
  sqlite3:
    path: packages/sqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: 2.15.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/coolapk_navigation.frag
    - assets/shaders/coolapk_navigation_captured.frag
    - assets/shaders/coolapk_content.frag
    - assets/shaders/coolapk_accent.frag
  assets:
    - assets/icqr/
