name: yanji
description: 研迹：本地优先、离线优先的考研学习记录工具。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.4
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  cryptography: ^2.9.0
  crypto: ^3.0.7
  timezone: ^0.11.1
  flutter_secure_storage: ^10.3.1
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner:
    git:
      url: https://github.com/juliansteenbakker/mobile_scanner.git
      ref: v7.4.0
  webview_flutter: ^4.10.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icqr/
